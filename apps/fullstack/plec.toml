# Host configuration for the Plec fullstack playground. `plec build` folds
# this into dist/plec-server.json; `plec serve` consumes only the generated
# manifest. Executable server code stays in src/server.ts (the `handleRequest`
# contract) — nothing here is evaluated by either host.

[app]
title = "Plec fullstack playground"
description = "Plec fullstack runtime experiment."

[compiler.host-imports]
lucide = { provider = "lucide", adapter = "@plec/lucide", ssr = true }
