[workspace]
resolver = "2"
members = [
  "packages/plec-runtime/crates/runtime",
  "crates/plec-parser",
  "crates/plec-compiler",
  "crates/plec-sema",
  "crates/plec-hir",
  "crates/plec-ir",
  "crates/plec-lowering",
  "crates/plec-inspect",
  "crates/plec-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
swc_common = "26.0.0"
swc_ecma_ast = "29.0.0"
swc_ecma_parser = "45.0.0"
swc_ecma_visit = "29.0.0"
tempfile = "3.3.0"
async-graphql = "7"
clap = { version = "4.6.6", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"