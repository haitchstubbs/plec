[workspace]
resolver = "2"
members = [
  "crates/plec-action",
  "crates/plec-cli",
  "crates/plec-compiler",
  "crates/plec-eval",
  "crates/plec-hir",
  "crates/plec-inspect",
  "crates/plec-ir",
  "crates/plec-lowering",
  "crates/plec-parser",
  "crates/plec-runtime",
  "crates/plec-client",
  "crates/plec-model",
  "crates/plec-schema",
  "crates/plec-dom",
  "crates/plec-build",
  "crates/plec-server",
  "crates/plec-query-core",
  "crates/plec-query-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
swc_common = "26.0.0"
swc_ecma_ast = "29.0.0"
swc_ecma_parser = "45.0.0"
swc_ecma_visit = "29.0.0"
tempfile = "3.3.0"
async-graphql = "7"
brotli = "8"
clap = { version = "4.6.6", features = ["derive"] }
plec-compiler = { path = "crates/plec-compiler" }
pollster = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = [
  "Comment",
  "console",
  "CssStyleDeclaration",
  "CustomEvent",
  "CustomEventInit",
  "Document",
  "DocumentFragment",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "History",
  "HtmlDocument",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "MouseEventInit",
  "Node",
  "NodeList",
  "Performance",
  "PerformanceEntry",
  "Storage",
  "Text",
  "Window",
] }
wasm-bindgen-test = "=0.3.78"
js-sys = "=0.3.105"
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
# 0.6 is the first series against http 1.x, which axum 0.8 requires.
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.11", default-features = false }
futures-util = { version = "0.3", default-features = false, features = [
  "std",
] }
thiserror = "1"
indexmap = "1"
# Internal Rust→Node sidecar HTTP client (hyper 1.x over a private socket).
hyper = { version = "1", default-features = false, features = [
  "client",
  "http1",
] }
hyper-util = { version = "0.1", default-features = false, features = [
  "tokio",
] }
http-body-util = "0.1"
getrandom = "0.4"
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
rmp-serde = "1"
once_cell = "1"
blake3 = "1"
dashmap = "6"
lru = "0.12"
parking_lot = "0.12"
smallvec = "1"
rstest = "0.25"
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
proptest = "1"
criterion = "0.8.2"
