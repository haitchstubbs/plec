[workspace]
resolver = "2"
members = [
  "crates/plec-cli",
  "crates/plec-compiler",
  "crates/plec-eval",
  "crates/plec-hir",
  "crates/plec-inspect",
  "crates/plec-ir",
  "crates/plec-lowering",
  "crates/plec-parser",
  "crates/plec-runtime", 
  "crates/plec-client",
  "crates/plec-model",
  "crates/plec-schema", "crates/plec-dom", "crates/plec-build",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
swc_common = "26.0.0"
swc_ecma_ast = "29.0.0"
swc_ecma_parser = "45.0.0"
swc_ecma_visit = "29.0.0"
tempfile = "3.3.0"
async-graphql = "7"
brotli = "8"
clap = { version = "4.6.6", features = ["derive"] }
plec-compiler = { path = "crates/plec-compiler" }
pollster = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Comment", "console", "CssStyleDeclaration", "CustomEvent", "CustomEventInit", "Document", "DocumentFragment", "DomTokenList", "Element", "Event", "EventTarget", "History", "HtmlDocument", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Location", "MediaQueryList", "MouseEvent", "MouseEventInit", "Node", "NodeList", "Performance", "PerformanceEntry", "Storage", "Text", "Window"] }
wasm-bindgen-test = "0.3"
js-sys = "0.3"
