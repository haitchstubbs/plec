name: Scheduled Security Audit

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security
  cancel-in-progress: false

jobs:
  audit:
    name: Full Rust advisory audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-security-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'deny.toml', 'cli-tools.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/cargo
          key: rust-security-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json') }}
      - run: yarn install:rust-security-tools
      - run: yarn rust:deps:audit
