name: Rust dependency audit

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - deny.toml
      - cli-tools.json
      - scripts/check-rust-deps.mjs
      - scripts/setup.mjs
      - scripts/toolchain.mjs
      - scripts/verify-toolchain.mjs
      - .github/workflows/rust-deps.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - deny.toml
      - cli-tools.json
      - scripts/check-rust-deps.mjs
      - scripts/setup.mjs
      - scripts/toolchain.mjs
      - scripts/verify-toolchain.mjs
      - .github/workflows/rust-deps.yml
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - name: Install JavaScript dependencies
        run: yarn install --immutable
      - name: Install pinned Rust security tools
        run: yarn install:rust-security-tools
      - name: Run full Rust dependency audit
        run: yarn rust:deps:audit
