name: OpenGrep

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    name: Static security scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned OpenGrep
        run: node scripts/install-opengrep.mjs

      - name: Scan Rust, TypeScript, JavaScript, and CSS
        run: >-
          ".tools/opengrep-1.30.0/opengrep" scan
          --config p/security-audit
          --sarif
          --sarif-output opengrep-results.sarif
          --error
          --include '*.rs'
          --include '*.ts'
          --include '*.tsx'
          --include '*.js'
          --include '*.jsx'
          --include '*.css'
          .

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: opengrep-results.sarif

      - name: Publish PR summary
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-sarif-summary.mjs opengrep
