# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: 'false'
      - run: yarn install:security-tools
      - run: yarn check:sast
      - name: Trivy source security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          version: v0.74.0
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-security-results.sarif
          exit-code: 1
          limit-severities-for-sarif: true
          skip-files: '**/node_modules/**'
          skip-dirs: '**/node_modules/**'
      - if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: opengrep-results.sarif
          category: opengrep
      - if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-security-results.sarif
          category: trivy-source-security
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-trivy-security
          path: trivy-security-results.sarif
          if-no-files-found: ignore
          retention-days: 1
      - if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-sarif-summary.mjs opengrep
  licenses:
    name: Licenses
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: 'false'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-security-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'deny.toml', 'cli-tools.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/cargo
          key: rust-security-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json') }}
      - run: yarn install:cargo-deny
      - run: yarn check:licenses
      - name: Trivy license gate and SARIF
        id: trivy-license
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          version: v0.74.0
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-license-results.sarif
          exit-code: 0
          limit-severities-for-sarif: true
      - if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-license-results.sarif
          category: trivy-license
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-trivy-license
          path: trivy-license-results.sarif
          if-no-files-found: ignore
          retention-days: 1

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: 'false'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-security-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'deny.toml', 'cli-tools.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/cargo
          key: rust-security-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json') }}
      - run: yarn install:rust-security-tools
      - run: yarn rust:deps:check
      - name: Trivy dependency vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-vulnerability-results.sarif
          exit-code: 1
          limit-severities-for-sarif: true
          skip-files: '**/node_modules/**'
          skip-dirs: '**/node_modules/**'
      - if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-vulnerability-results.sarif
          category: trivy-vulnerabilities
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-trivy-vulnerability
          path: trivy-vulnerability-results.sarif
          if-no-files-found: ignore
          retention-days: 1

  trivy-summary:
    name: Trivy PR Summary
    if: always()
    needs: [security, licenses, dependency-audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-plec
      - if: github.event_name == 'pull_request'
        run: yarn install --immutable
      - if: github.event_name == 'pull_request'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        continue-on-error: true
        with:
          pattern: ci-trivy-*
          path: .
          merge-multiple: true
      - if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SECURITY_SCAN_OUTCOME: ${{ (needs.security.result == 'success' && needs.dependency-audit.result == 'success') && 'success' || 'failure' }}
          LICENSE_GATE_OUTCOME: ${{ needs.licenses.result == 'success' && 'success' || 'failure' }}
        run: node scripts/pr-sarif-summary.mjs trivy

  native-unit:
    name: Native & Unit
    needs: [security, licenses, dependency-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: native-unit-v1-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.toml', 'crates/**/*.rs') }}
          cache-workspace-crates: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-native-unit-${{ runner.os }}-${{ hashFiles('yarn.lock', 'turbo.json', 'packages/**/package.json', 'packages/**/*.{ts,tsx,js,jsx,json}') }}
          restore-keys: turbo-native-unit-${{ runner.os }}-
      - run: yarn install --immutable
      - name: Build @plec/node JS exports for CLI dev-loop tests
        run: yarn workspace @plec/node build:js
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked --no-run
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --locked -p plec-cli
      - run: yarn format:check
      - run: yarn workspace @plec/node build
      - run: yarn turbo run typecheck --filter='./packages/*'
      - run: yarn turbo run test --filter='./packages/*' --filter='!@plec/core'
      - run: yarn workspace @plec/node test:native
      - run: yarn workspace @plec/node test:package
      - run: yarn turbo run test:package --filter=@plec/core

  node-native-build:
    name: Build @plec/node ${{ matrix.packageTarget }}
    needs: [native-unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            packageTarget: linux-x64-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            packageTarget: linux-x64-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            packageTarget: linux-arm64-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            packageTarget: darwin-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            packageTarget: darwin-arm64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            packageTarget: win32-x64-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: node-native-${{ matrix.packageTarget }}
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.toml', 'crates/**/*.rs') }}
          cache-workspace-crates: true
      - run: yarn install --immutable
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.musl
        run: |
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Build N-API addon for target
        run: >-
          yarn workspace @plec/node exec napi build --platform
          --manifest-path ../../crates/plec-node-bindings/Cargo.toml
          --profile node-release --output-dir native --js index.js
          --dts bindings.d.ts --format esm --target ${{ matrix.target }}
      - name: Smoke-test packed native package on host
        if: matrix.packageTarget == 'linux-x64-gnu' || startsWith(matrix.packageTarget, 'darwin-') || matrix.packageTarget == 'win32-x64-msvc'
        run: |
          yarn workspace @plec/node build:js
          yarn workspace @plec/node package:dirs
          yarn workspace @plec/node package:stage:local
          yarn workspace @plec/node exec node scripts/test-packed-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plec-node-${{ matrix.packageTarget }}
          path: packages/plec-node/native/index.${{ matrix.packageTarget }}.node
          if-no-files-found: error

  node-native-packages:
    name: Assemble @plec/node platform packages
    needs: [node-native-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - run: yarn install --immutable
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: plec-node-*
          path: packages/plec-node/native
          merge-multiple: true
      - run: yarn workspace @plec/node package:dirs
      - run: yarn workspace @plec/node package:stage
      - run: yarn workspace @plec/node check:platform-artifacts
      - run: yarn workspace @plec/node test:package
      - run: yarn workspace @plec/node check:platform-artifacts

  wasm-release:
    name: WASM & Release
    needs: [security, licenses, dependency-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wasm-release-v1-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.toml', 'crates/**/*.rs') }}
          cache-workspace-crates: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-wasm-release-${{ runner.os }}-${{ hashFiles('yarn.lock', 'turbo.json', 'packages/**/package.json', 'packages/**/*.{ts,tsx,js,jsx,json}', 'apps/fullstack/package.json', 'apps/fullstack/src/**/*.{ts,tsx,js,jsx,json}', 'apps/fullstack/*.json', 'apps/fullstack/*.toml') }}
          restore-keys: turbo-wasm-release-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            .cache/ms-playwright
          key: browser-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json', 'yarn.lock') }}
          restore-keys: browser-tools-${{ runner.os }}-${{ runner.arch }}-
      - run: yarn install --immutable
      - run: yarn install:build-tools
      - run: yarn install:browser-tools
      - run: yarn install:cargo-deny
      - run: yarn workspace @plec/query compile
      - run: cargo build --locked -p plec-cli
      - run: echo "PLEC_BIN=$GITHUB_WORKSPACE/target/debug/plec" >> "$GITHUB_ENV"
      - run: yarn turbo run build --filter='./packages/*'
      - run: yarn test:wasm
      - run: yarn workspace fullstack build
      - run: yarn workspace fullstack typecheck:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fullstack-dist
          path: |
            apps/fullstack/dist/
            packages/plec/dist/
          retention-days: 1

  acceptance:
    name: Acceptance
    needs: wasm-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - run: yarn install --immutable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            .cache/ms-playwright
          key: browser-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json', 'yarn.lock') }}
          restore-keys: browser-tools-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: fullstack-dist
          path: .
      - run: yarn install:browser-tools
      - run: yarn workspace @plec/e2e test:acceptance

  e2e:
    name: E2E
    needs: wasm-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - run: yarn install --immutable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            .cache/ms-playwright
          key: browser-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json', 'yarn.lock') }}
          restore-keys: browser-tools-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: fullstack-dist
          path: .
      - run: yarn install:browser-tools
      - run: yarn workspace @plec/e2e test:e2e:moved-dist
      - run: yarn workspace @plec/e2e test:e2e

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      [
        security,
        licenses,
        dependency-audit,
        trivy-summary,
        native-unit,
        node-native-build,
        node-native-packages,
        wasm-release,
        acceptance,
        e2e,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every stage to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: node -e "const r=JSON.parse(process.env.RESULTS); if(r.some(x=>x!=='success')) { console.error(r); process.exit(1) }"
