# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: 'false'
      - run: yarn install:security-tools
      - run: yarn check:sast
      - name: Trivy source security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          version: v0.74.0
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-security-results.sarif
          exit-code: 1
          limit-severities-for-sarif: true
          skip-files: '**/node_modules/**'
          skip-dirs: '**/node_modules/**'
      - if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: opengrep-results.sarif
          category: opengrep
      - if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-security-results.sarif
          category: trivy-source-security
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-trivy-security
          path: trivy-security-results.sarif
          if-no-files-found: ignore
          retention-days: 1
      - if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-sarif-summary.mjs opengrep
  licenses:
    name: Licenses
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: 'false'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-security-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'deny.toml', 'cli-tools.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/cargo
          key: rust-security-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json') }}
      - run: yarn install:cargo-deny
      - run: yarn check:licenses
      - name: Trivy license gate and SARIF
        id: trivy-license
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          version: v0.74.0
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-license-results.sarif
          # cargo-deny is the blocking license policy gate. Trivy's license
          # classifier is retained for SARIF visibility without failing CI on
          # classifications that are not violations of the repository policy.
          exit-code: 0
      - if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-license-results.sarif
          category: trivy-license
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-trivy-license
          path: trivy-license-results.sarif
          if-no-files-found: ignore
          retention-days: 1

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: 'false'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-security-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'deny.toml', 'cli-tools.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/cargo
          key: rust-security-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json') }}
      - run: yarn install:rust-security-tools
      - run: yarn rust:deps:check
      - name: Trivy dependency vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-vulnerability-results.sarif
          exit-code: 1
          limit-severities-for-sarif: true
          skip-files: '**/node_modules/**'
          skip-dirs: '**/node_modules/**'
      - if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-vulnerability-results.sarif
          category: trivy-vulnerabilities
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-trivy-vulnerability
          path: trivy-vulnerability-results.sarif
          if-no-files-found: ignore
          retention-days: 1

  trivy-summary:
    name: Trivy PR Summary
    if: always()
    needs: [security, licenses, dependency-audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-plec
      - if: github.event_name == 'pull_request'
        run: yarn install --immutable
      - if: github.event_name == 'pull_request'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        continue-on-error: true
        with:
          pattern: ci-trivy-*
          path: .
          merge-multiple: true
      - if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SECURITY_SCAN_OUTCOME: ${{ (needs.security.result == 'success' && needs.dependency-audit.result == 'success') && 'success' || 'failure' }}
          LICENSE_GATE_OUTCOME: ${{ needs.licenses.result == 'success' && 'success' || 'failure' }}
        run: node scripts/pr-sarif-summary.mjs trivy

  crates:
    name: Crates
    needs: [security, licenses, dependency-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: crates-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.toml', 'crates/**/*.rs') }}
          cache-bin: true
          cache-workspace-crates: true
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked --no-run
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --locked -p plec-cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crates-output
          path: target/debug/plec
          retention-days: 1

  packages:
    name: Packages
    needs: crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: crates-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.toml', 'crates/**/*.rs') }}
          cache-bin: true
          cache-workspace-crates: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('yarn.lock', 'turbo.json', 'packages/**/package.json', 'packages/**/*.{ts,tsx,js,jsx,json}') }}
          restore-keys: turbo-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            .cache/ms-playwright
          key: browser-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json', 'yarn.lock') }}
          restore-keys: browser-tools-${{ runner.os }}-${{ runner.arch }}-
      - run: yarn install --immutable
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: crates-output
          path: target/debug
      - run: chmod +x target/debug/plec
      - run: yarn install:build-tools
      - run: yarn install:browser-tools
      - run: yarn format:check
      - run: yarn turbo run build typecheck --filter='./packages/*'
      - run: yarn turbo run test --filter='./packages/*' --filter='!@plec/core'
      - run: yarn turbo run test:package --filter=@plec/core
      - run: yarn test:wasm
        env:
          PLEC_BIN: ${{ github.workspace }}/target/debug/plec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-output
          path: |
            packages/*/dist/
            target/debug/plec
          if-no-files-found: warn
          retention-days: 1

  fullstack-build:
    name: Fullstack Build
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: crates-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.toml', 'crates/**/*.rs') }}
          cache-bin: true
          cache-workspace-crates: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('yarn.lock', 'turbo.json', 'packages/**/package.json', 'apps/fullstack/**') }}
          restore-keys: turbo-${{ runner.os }}-
      - run: yarn install --immutable
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: packages-output
          path: .
      - run: chmod +x target/debug/plec
      - run: yarn workspace fullstack build
        env:
          PLEC_BIN: ${{ github.workspace }}/target/debug/plec
      - run: yarn workspace fullstack typecheck:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fullstack-dist
          path: |
            apps/fullstack/dist/
            target/debug/plec
          retention-days: 1

  acceptance:
    name: Acceptance
    needs: fullstack-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - run: yarn install --immutable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            .cache/ms-playwright
          key: browser-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json', 'yarn.lock') }}
          restore-keys: browser-tools-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: fullstack-dist
          path: .
      - run: chmod +x target/debug/plec
      - run: yarn install:browser-tools
      - run: yarn workspace @plec/e2e test:acceptance
        env:
          PLEC_BIN: ${{ github.workspace }}/target/debug/plec

  e2e:
    name: E2E
    needs: fullstack-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-plec
      - run: yarn install --immutable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            .cache/ms-playwright
          key: browser-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json', 'yarn.lock') }}
          restore-keys: browser-tools-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: fullstack-dist
          path: .
      - run: chmod +x target/debug/plec
      - run: yarn install:browser-tools
      - run: yarn workspace @plec/e2e test:e2e
        env:
          PLEC_BIN: ${{ github.workspace }}/target/debug/plec

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      [
        security,
        licenses,
        dependency-audit,
        trivy-summary,
        crates,
        packages,
        fullstack-build,
        acceptance,
        e2e,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every stage to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: node -e "const r=JSON.parse(process.env.RESULTS); if(r.some(x=>x!=='success')) { console.error(r); process.exit(1) }"
