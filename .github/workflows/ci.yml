# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-v2-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.toml', 'crates/**/*.rs', 'cli-tools.json') }}
          cache-bin: true
          cache-workspace-crates: true
          save-if: false
      - name: Install dependencies
        run: yarn install --immutable
      - name: Restore pinned Rust security tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/cargo
          key: rust-security-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json') }}
      - name: Install pinned Rust security tools
        run: yarn install:rust-security-tools
      - name: Check formatting
        run: yarn format:check
      - name: Typecheck
        run: yarn typecheck

  required:
    name: Tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-v2-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.toml', 'crates/**/*.rs', 'cli-tools.json') }}
          cache-bin: true
          cache-workspace-crates: true
      - name: Restore pinned tools and browser assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            .cache/ms-playwright
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json') }}
      - name: Restore Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install build tools
        run: yarn install:build-tools
      - name: Check Rust dependency policy
        run: yarn rust:deps:check
      - name: Verify browser toolchain
        run: yarn toolchain:verify:browser
      - name: Build development Plec CLI
        run: cargo build --locked -p plec-cli
      - name: Test
        run: yarn test
      - name: Test WASM
        env:
          PLEC_BIN: ${{ github.workspace }}/target/debug/plec
        run: yarn test:wasm
      - name: Build and test E2E
        env:
          PLEC_BIN: ${{ github.workspace }}/target/debug/plec
        run: yarn turbo run build test:e2e

  artifact:
    name: Build Artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-v2-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.toml', 'crates/**/*.rs', 'cli-tools.json') }}
          cache-bin: true
          cache-workspace-crates: true
          save-if: false
      - name: Restore pinned tools and browser assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            .cache/ms-playwright
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json') }}
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install build tools
        run: yarn install:build-tools
      - name: Build release artifact
        run: yarn workspace @plec/core build:artifact
