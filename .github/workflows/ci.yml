name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'cli-tools.json') }}
          cache-bin: true
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check formatting
        run: yarn format:check
      - name: Typecheck
        run: yarn typecheck

  required:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          key: ${{ hashFiles('Cargo.lock', 'cli-tools.json') }}
          cache-bin: true
      - name: Restore pinned tools and browser assets
        uses: actions/cache@v4
        with:
          path: |
            .tools
            .cache/ms-playwright
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli-tools.json') }}
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install build tools
        run: yarn install:build-tools
      - name: Verify browser toolchain
        run: yarn toolchain:verify:browser
      - name: Build development Plec CLI
        run: cargo build --locked -p plec-cli
      - name: Test
        run: yarn test
      - name: Test WASM
        env:
          PLEC_BIN: ${{ github.workspace }}/target/debug/plec
        run: yarn test:wasm
      - name: Build and test E2E
        run: yarn turbo run build test:e2e
