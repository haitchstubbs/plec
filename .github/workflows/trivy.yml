name: Trivy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependency metadata without running package scripts
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: 'false'

      - name: Trivy scan
        id: trivy-security-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          limit-severities-for-sarif: true
          skip-files: '**/node_modules/**'
          skip-dirs: '**/node_modules/**'

      - name: Trivy license gate
        id: trivy-license-gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          version: v0.74.0
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1

      - name: Trivy license report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          version: v0.74.0
          format: sarif
          output: trivy-license-results.sarif
          exit-code: 0

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
      - name: Upload license results
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-license-results.sarif
          category: trivy-license

      - name: Publish PR summary
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SECURITY_SCAN_OUTCOME: ${{ steps.trivy-security-scan.outcome }}
          LICENSE_GATE_OUTCOME: ${{ steps.trivy-license-gate.outcome }}
        run: node scripts/pr-sarif-summary.mjs trivy
