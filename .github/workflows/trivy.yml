name: Trivy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          limit-severities-for-sarif: true
          skip-files: '**/node_modules/**'
          skip-dirs: '**/node_modules/**'

      - name: Trivy license gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          version: v0.74.0
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1
          skip-files: '**/node_modules/**'
          skip-dirs: '**/node_modules/**'

      - name: Trivy license report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          version: v0.74.0
          format: sarif
          output: trivy-license-results.sarif
          exit-code: 0
          skip-files: '**/node_modules/**'
          skip-dirs: '**/node_modules/**'

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
      - name: Upload license results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-license-results.sarif
          category: trivy-license

      - name: Publish PR summary
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-sarif-summary.mjs trivy
