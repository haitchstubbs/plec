name: Setup Plec Node environment
description: Provision the pinned Node/Yarn runtime and restore the Yarn cache.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .node-version
    - name: Enable Corepack
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/plec-corepack"
        corepack enable --install-directory "$RUNNER_TEMP/plec-corepack"
        corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
        echo "$RUNNER_TEMP/plec-corepack" >> "$GITHUB_PATH"
        export PATH="$RUNNER_TEMP/plec-corepack:$PATH"
        yarn --version
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-
