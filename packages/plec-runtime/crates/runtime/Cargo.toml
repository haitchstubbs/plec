[package]
name = "plec_runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["router", "fetch"]
router = []
fetch = ["dep:wasm-bindgen-futures", "web-sys/AbortController", "web-sys/AbortSignal", "web-sys/Headers", "web-sys/Request", "web-sys/RequestInit", "web-sys/Response"]

# The benchmark already instruments unoptimised runtime behaviour. Avoid the
# external wasm-opt binary so builds remain reproducible on locked-down hosts.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
plec-ir = { path = "../../../../crates/plec-ir" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Comment", "console", "CssStyleDeclaration", "CustomEvent", "CustomEventInit", "Document", "DocumentFragment", "DomTokenList", "Element", "Event", "EventTarget", "History", "HtmlDocument", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Location", "MediaQueryList", "MouseEvent", "Node", "NodeList", "Performance", "PerformanceEntry", "Storage", "Text", "Window"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
