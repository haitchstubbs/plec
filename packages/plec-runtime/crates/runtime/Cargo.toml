[package]
name = "plec_runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["router", "fetch"]
router = []
fetch = []

# The benchmark already instruments unoptimised runtime behaviour. Avoid the
# external wasm-opt binary so builds remain reproducible on locked-down hosts.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Comment", "CssStyleDeclaration", "Document", "DocumentFragment", "DomTokenList", "Element", "Event", "EventTarget", "Headers", "History", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Location", "MediaQueryList", "MouseEvent", "Node", "NodeList", "Performance", "PerformanceEntry", "Request", "RequestInit", "Response", "Storage", "Text", "Window"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
