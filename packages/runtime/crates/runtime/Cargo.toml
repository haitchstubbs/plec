[package]
name = "wasm_runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# The benchmark already instruments unoptimised runtime behaviour. Avoid the
# external wasm-opt binary so builds remain reproducible on locked-down hosts.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "Document", "DocumentFragment", "DomTokenList", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement", "MediaQueryList", "Node", "NodeList", "Performance", "PerformanceEntry", "Storage", "Text", "Window"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
