[package]
name = "plec-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["serde"]
serde = [
  "dep:serde",
  "plec-action/serde",
  "plec-dom/serde",
  "plec-eval/serde",
  "plec-schema/serde",
]
# Mirrors the wasm facade's `fetch` feature: compiles the async fetch action
# VM and enables fetch capability validation in plec-schema.
fetch = [
  "dep:wasm-bindgen-futures",
  "plec-schema/fetch",
  "web-sys/AbortController",
  "web-sys/AbortSignal",
  "web-sys/Headers",
  "web-sys/Request",
  "web-sys/RequestCredentials",
  "web-sys/RequestInit",
  "web-sys/Response",
  "web-sys/Url",
  "web-sys/ReadableStream",
  "web-sys/ReadableStreamDefaultReader",
  "web-sys/TextDecoder",
]

[dependencies]
plec-action = { path = "../plec-action", version = "0.1.0", default-features = false }
js-sys = { workspace = true }
plec-dom = { path = "../plec-dom", version = "0.1.0", default-features = false }
plec-eval = { path = "../plec-eval", version = "0.1.0", default-features = false }
plec-ir = { path = "../plec-ir", version = "0.1.0", default-features = false }
plec-schema = { path = "../plec-schema", version = "0.1.0", default-features = false }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
plec-schema = { path = "../plec-schema", version = "0.1.0", features = ["serde"] }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
