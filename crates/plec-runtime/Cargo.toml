[package]
name = "plec-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["router", "fetch"]
router = []
fetch = ["plec-client/fetch"]
decode-bench = ["plec-schema/serde", "dep:serde", "dep:serde_json"]

[dependencies]
plec-client = { path = "../plec-client", version = "0.1.0", default-features = false }
plec-dom = { path = "../plec-dom", version = "0.1.0", default-features = false }
plec-eval = { path = "../plec-eval", version = "0.1.0", default-features = false }
plec-ir = { path = "../plec-ir", version = "0.1.0", default-features = false }
plec-router = { path = "../plec-router", version = "0.1.0", default-features = false }
plec-schema = { path = "../plec-schema", version = "0.1.0", default-features = false }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
plec-schema = { path = "../plec-schema", version = "0.1.0", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }
