[package]
name = "plec-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["router", "fetch"]
router = []
fetch = ["plec-client/fetch"]

[dependencies]
plec-client = { path = "../plec-client", version = "0.1.0" }
plec-dom = { path = "../plec-dom", version = "0.1.0" }
plec-eval = { path = "../plec-eval", version = "0.1.0" }
plec-ir = { path = "../plec-ir", version = "0.1.0" }
plec-router = { path = "../plec-router", version = "0.1.0" }
plec-schema = { path = "../plec-schema", version = "0.1.0" }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }

[dev-dependencies]
serde-wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }
